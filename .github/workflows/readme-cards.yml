# Generates all README stat cards as static SVGs inside this repo, so the profile
# no longer depends on the rate-limited public *.vercel.app instances.
# Place this file at: ratnakanth/ratnakanth/.github/workflows/readme-cards.yml
name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"        # daily, 03:00 UTC
  workflow_dispatch:           # allows "Run workflow" button for first run
  push:
    branches: [main]
    paths: [".github/workflows/readme-cards.yml"]

permissions:
  contents: write

env:
  ACCENT: ba9960               # kanth.me gold
  BG: 0b0b0b
  TEXT: f5f5f5
  MUTED: 9a9a9a

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=ratnakanth&show_icons=true&include_all_commits=true&hide_border=false&border_color=${{ env.ACCENT }}&title_color=${{ env.ACCENT }}&icon_color=${{ env.ACCENT }}&ring_color=${{ env.ACCENT }}&text_color=${{ env.TEXT }}&bg_color=${{ env.BG }}
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=ratnakanth&layout=compact&langs_count=8&border_color=${{ env.ACCENT }}&title_color=${{ env.ACCENT }}&text_color=${{ env.TEXT }}&bg_color=${{ env.BG }}
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin — Magento2SEO
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=ratnakanth&repo=Magento2SEO&border_color=${{ env.ACCENT }}&title_color=${{ env.ACCENT }}&icon_color=${{ env.ACCENT }}&text_color=${{ env.TEXT }}&bg_color=${{ env.BG }}
          path: profile/pin-Magento2SEO.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin — ratna-One-page-Checkout
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=ratnakanth&repo=ratna-One-page-Checkout&border_color=${{ env.ACCENT }}&title_color=${{ env.ACCENT }}&icon_color=${{ env.ACCENT }}&text_color=${{ env.TEXT }}&bg_color=${{ env.BG }}
          path: profile/pin-ratna-One-page-Checkout.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin — M2-Recently-Viewed
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=ratnakanth&repo=M2-Recently-Viewed&border_color=${{ env.ACCENT }}&title_color=${{ env.ACCENT }}&icon_color=${{ env.ACCENT }}&text_color=${{ env.TEXT }}&bg_color=${{ env.BG }}
          path: profile/pin-M2-Recently-Viewed.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin — crm
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=ratnakanth&repo=crm&border_color=${{ env.ACCENT }}&title_color=${{ env.ACCENT }}&icon_color=${{ env.ACCENT }}&text_color=${{ env.TEXT }}&bg_color=${{ env.BG }}
          path: profile/pin-crm.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Achievements (trophy replacement) + contribution activity (graph replacement)
      - name: Metrics (achievements + activity)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ratnakanth
          filename: profile/metrics.svg
          template: classic
          base: ""
          config_timezone: Europe/London
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: no
          config_display: large
          output_action: none   # committed below with the other SVGs

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
